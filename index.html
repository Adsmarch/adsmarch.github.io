<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>知识库 · 文档中心</title>
    <!-- Tailwind CSS CDN (play CDN 提供即时编译) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- 自定义微小调整 (不影响 Tailwind) -->
    <style>
        /* 仅用于卡片悬停微调 & 过渡，Tailwind 无直接 transition 组合 */
        .article-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .article-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        /* 侧边栏滚动 */
        .sidebar-scroll {
            scrollbar-width: thin;
            scrollbar-color: #d1d5db transparent;
        }
        .sidebar-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 8px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        /* 搜索框 focus 阴影 (Tailwind 的 focus:ring 已加) */
    </style>
</head>
<body>

    <!-- ===== 整体 flex 容器 ===== -->
    <div class="flex min-h-screen bg-gray-50 font-sans antialiased">

        <!-- ===== 侧边栏 ===== -->
        <aside id="sidebar" class="sidebar-scroll fixed md:sticky top-0 left-0 z-50 w-72 h-screen bg-white border-r border-gray-200 p-6 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0">
            <!-- 品牌 -->
            <div class="flex items-center gap-3 pb-6 border-b border-gray-200 mb-6">
                <div class="w-10 h-10 rounded-lg  flex items-center justify-center text-white text-xl flex-shrink-0">
                    <img src="https://cdn-ileomea.nitrocdn.com/nvzfakHRyVfIGGJeDmnOZNHTIqFIoLeq/assets/images/optimized/www.adsmarch.cn/wp-content/uploads/2023/12/cropped-logo-180x180.png">
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800 leading-tight">知识库</h1>
                    <span class="text-xs text-gray-500 font-medium">文档中心</span>
                </div>
            </div>

            <!-- 导航分类 (静态) -->
            <nav class="flex-1 overflow-y-auto">
                <div class="mb-6">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">分类</p>
                    <ul class="space-y-1" id="categoryNav">
                        <!-- 由 JavaScript 动态生成，但保留静态占位 -->
                        <li><a href="#" data-category="all" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition active"><i class="fas fa-th-list w-5 text-gray-400"></i> 全部</a></li>
                    </ul>
                </div>
                <div class="mb-6">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">快捷</p>
                    <ul class="space-y-1">
                        <li><a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition"><i class="fas fa-star w-5 text-gray-400"></i> 收藏</a></li>
                        <li><a href="#" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition"><i class="fas fa-clock w-5 text-gray-400"></i> 最近</a></li>
                    </ul>
                </div>
            </nav>

            <!-- 侧边栏底部 -->
            <div class="pt-4 border-t border-gray-200 text-xs text-gray-400 flex justify-between">
                <span>共 <span id="totalCount">0</span> 篇文章</span>
                <span>v1.0</span>
            </div>
        </aside>

        <!-- ===== 主内容 ===== -->
        <main class="flex-1 min-w-0 px-4 md:px-10 py-6 md:py-8 max-w-6xl mx-auto">

            <!-- 顶部栏 -->
            <header class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-gray-200 mb-6">
                <div class="flex items-center gap-3">
                    <!-- 移动端菜单按钮 -->
                    <button id="menuToggle" class="md:hidden text-gray-600 hover:bg-gray-100 p-2 rounded-lg transition">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h2 class="text-xl font-semibold text-gray-800 flex items-center gap-2">
                        全部文章
                        <span class="text-xs font-medium bg-blue-100 text-blue-700 px-3 py-0.5 rounded-full">最新</span>
                    </h2>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <!-- 搜索框 -->
                    <div class="relative flex-1 md:w-64">
                        <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                        <input type="text" id="searchInput" placeholder="搜索文章..." class="w-full pl-9 pr-4 py-2 border border-gray-300 rounded-full bg-gray-100 focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm outline-none transition" />
                    </div>
                    <button class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </header>

            <!-- 分类过滤标签 (水平) -->
            <div class="flex flex-wrap gap-2 mb-6" id="filterBar">
                <!-- 由 JavaScript 动态生成，占位 -->
                <button data-category="all" class="filter-btn active px-4 py-1.5 text-sm font-medium rounded-full border border-gray-300 bg-blue-600 text-white hover:bg-blue-700 transition">全部</button>
            </div>

            <!-- 文章卡片网格 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5" id="articlesGrid">
                <!-- 动态渲染 -->
            </div>

            <!-- 空状态 -->
            <div id="emptyState" class="hidden text-center py-16">
                <i class="fas fa-inbox text-5xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">没有找到匹配的文章</p>
                <p class="text-gray-400 text-sm mt-1">试试调整关键词或分类</p>
            </div>
        </main>
    </div>

    <!-- ===== JavaScript 数据 & 逻辑 ===== -->
    <script>
        (function() {
            'use strict';

            // -------- 模拟文章数据 --------
            const articles = [{
                id: 1,
                title: 'Tailwind CSS 快速上手',
                summary: '学习如何使用 Tailwind 工具类构建现代界面，提升开发效率。',
                category: '前端',
                tags: ['CSS', '框架'],
                date: '2026-08-15',
                icon: 'fa-brands fa-tailwind'
            }, {
                id: 2,
                title: 'GitHub Pages 部署指南',
                summary: '从零开始将静态站点部署到 GitHub Pages，自定义域名与 HTTPS。',
                category: '运维',
                tags: ['Git', '部署'],
                date: '2026-08-12',
                icon: 'fa-brands fa-github'
            }, {
                id: 3,
                title: 'JavaScript 异步编程详解',
                summary: '深入理解 Promise、async/await 以及事件循环机制。',
                category: '前端',
                tags: ['JavaScript'],
                date: '2026-08-10',
                icon: 'fa-brands fa-js'
            }, {
                id: 4,
                title: 'Docker 容器化入门',
                summary: '掌握 Docker 基本命令，构建镜像并管理容器化应用。',
                category: '运维',
                tags: ['Docker', '容器'],
                date: '2026-08-08',
                icon: 'fa-brands fa-docker'
            }, {
                id: 5,
                title: '设计系统 与 组件化',
                summary: '构建设计系统，统一团队 UI 组件，提升产品一致性。',
                category: '设计',
                tags: ['UI/UX'],
                date: '2026-08-05',
                icon: 'fa-solid fa-pen-ruler'
            }, {
                id: 6,
                title: 'Python 数据分析实战',
                summary: '使用 Pandas 和 Matplotlib 进行数据清洗与可视化。',
                category: '后端',
                tags: ['Python', '数据'],
                date: '2026-08-02',
                icon: 'fa-brands fa-python'
            }, {
                id: 7,
                title: 'React 性能优化技巧',
                summary: '使用 memo、useCallback 和 代码分割 提升 React 应用性能。',
                category: '前端',
                tags: ['React'],
                date: '2026-07-30',
                icon: 'fa-brands fa-react'
            }, {
                id: 8,
                title: 'Linux 服务器管理基础',
                summary: '常用命令行操作、权限管理和系统监控工具。',
                category: '运维',
                tags: ['Linux', '服务器'],
                date: '2026-07-28',
                icon: 'fa-brands fa-linux'
            }, {
                id: 9,
                title: 'UI 设计心理学',
                summary: '如何利用心理学原理提升用户体验与转化率。',
                category: '设计',
                tags: ['UX'],
                date: '2026-07-25',
                icon: 'fa-solid fa-brain'
            }];

            // 提取所有分类 (去重)
            const categories = ['all', ...new Set(articles.map(a => a.category))];

            // DOM 元素
            const grid = document.getElementById('articlesGrid');
            const emptyState = document.getElementById('emptyState');
            const searchInput = document.getElementById('searchInput');
            const filterBar = document.getElementById('filterBar');
            const categoryNav = document.getElementById('categoryNav');
            const totalSpan = document.getElementById('totalCount');
            const menuToggle = document.getElementById('menuToggle');
            const sidebar = document.getElementById('sidebar');

            // 当前状态
            let currentCategory = 'all';
            let currentSearch = '';

            // -------- 渲染函数 --------
            function render() {
                // 过滤
                const filtered = articles.filter(article => {
                    const matchCategory = currentCategory === 'all' || article.category === currentCategory;
                    const searchLower = currentSearch.trim().toLowerCase();
                    const matchSearch = searchLower === '' ||
                        article.title.toLowerCase().includes(searchLower) ||
                        article.summary.toLowerCase().includes(searchLower) ||
                        article.tags.some(tag => tag.toLowerCase().includes(searchLower));
                    return matchCategory && matchSearch;
                });

                // 更新总数
                totalSpan.textContent = articles.length;

                // 空状态
                if (filtered.length === 0) {
                    grid.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                // 生成卡片
                grid.innerHTML = filtered.map(article => `
                    <a href="#" class="article-card block bg-white border border-gray-200 rounded-xl p-5 shadow-sm hover:border-blue-300 no-underline text-gray-800">
                        <div class="flex items-start justify-between">
                            <div class="flex items-center gap-2">
                                <i class="${article.icon} text-lg text-blue-600 w-6"></i>
                                <span class="text-xs font-semibold text-blue-700 bg-blue-50 px-2.5 py-0.5 rounded-full">${article.category}</span>
                            </div>
                            <span class="text-xs text-gray-400">${article.date}</span>
                        </div>
                        <h3 class="text-base font-semibold mt-3 mb-1 line-clamp-2">${article.title}</h3>
                        <p class="text-sm text-gray-500 line-clamp-2">${article.summary}</p>
                        <div class="mt-3 flex flex-wrap gap-1.5">
                            ${article.tags.map(tag => `<span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">#${tag}</span>`).join('')}
                        </div>
                    </a>
                `).join('');
            }

            // -------- 更新筛选按钮状态 (水平过滤栏) --------
            function updateFilterButtons() {
                // 水平过滤栏
                const btns = filterBar.querySelectorAll('.filter-btn');
                btns.forEach(btn => {
                    const cat = btn.dataset.category;
                    if (cat === currentCategory) {
                        btn.classList.add('bg-blue-600', 'text-white', 'border-blue-600');
                        btn.classList.remove('bg-white', 'text-gray-700', 'border-gray-300', 'hover:bg-gray-50');
                    } else {
                        btn.classList.remove('bg-blue-600', 'text-white', 'border-blue-600');
                        btn.classList.add('bg-white', 'text-gray-700', 'border-gray-300', 'hover:bg-gray-50');
                    }
                });
                // 侧边栏导航高亮
                const navLinks = categoryNav.querySelectorAll('a');
                navLinks.forEach(link => {
                    const cat = link.dataset.category;
                    if (cat === currentCategory) {
                        link.classList.add('bg-blue-50', 'text-blue-600');
                        link.classList.remove('text-gray-600', 'hover:bg-blue-50');
                    } else {
                        link.classList.remove('bg-blue-50', 'text-blue-600');
                        link.classList.add('text-gray-600', 'hover:bg-blue-50');
                    }
                });
            }

            // -------- 构建过滤栏和侧边栏分类 --------
            function buildCategories() {
                // 水平过滤栏
                filterBar.innerHTML = categories.map(cat => `
                    <button data-category="${cat}" class="filter-btn px-4 py-1.5 text-sm font-medium rounded-full border transition 
                        ${cat === 'all' ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50'}">
                        ${cat === 'all' ? '全部' : cat}
                    </button>
                `).join('');

                // 侧边栏导航 (只显示分类，去掉全部，因为已有全部)
                const navItems = categories.filter(c => c !== 'all').map(cat => `
                    <li><a href="#" data-category="${cat}" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 transition">
                        <i class="fas fa-folder-open w-5 text-gray-400"></i> ${cat}
                    </a></li>
                `).join('');
                // 在侧边栏“分类”区域插入，保留“全部”作为第一项
                categoryNav.innerHTML = `
                    <li><a href="#" data-category="all" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600 transition">
                        <i class="fas fa-th-list w-5 text-blue-600"></i> 全部
                    </a></li>
                    ${navItems}
                `;

                // 绑定事件：水平过滤栏
                filterBar.addEventListener('click', (e) => {
                    const btn = e.target.closest('.filter-btn');
                    if (!btn) return;
                    const cat = btn.dataset.category;
                    if (cat === currentCategory) return;
                    currentCategory = cat;
                    updateFilterButtons();
                    render();
                });

                // 绑定事件：侧边栏分类
                categoryNav.addEventListener('click', (e) => {
                    const link = e.target.closest('a');
                    if (!link) return;
                    e.preventDefault();
                    const cat = link.dataset.category;
                    if (!cat) return;
                    if (cat === currentCategory) return;
                    currentCategory = cat;
                    updateFilterButtons();
                    render();
                    // 移动端自动关闭侧边栏
                    if (window.innerWidth < 768) {
                        sidebar.classList.add('-translate-x-full');
                    }
                });
            }

            // -------- 搜索事件 --------
            searchInput.addEventListener('input', (e) => {
                currentSearch = e.target.value;
                render();
            });

            // -------- 移动端菜单切换 --------
            menuToggle.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });

            // 点击外部关闭侧边栏（移动端）
            document.addEventListener('click', (e) => {
                if (window.innerWidth < 768) {
                    const isClickInside = sidebar.contains(e.target) || menuToggle.contains(e.target);
                    if (!isClickInside && !sidebar.classList.contains('-translate-x-full')) {
                        sidebar.classList.add('-translate-x-full');
                    }
                }
            });

            // -------- 初始化 --------
            buildCategories();
            render();
            updateFilterButtons();

            // 窗口大小变化时，如果变宽则显示侧边栏
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768) {
                    sidebar.classList.remove('-translate-x-full');
                } else {
                    // 移动端默认隐藏，但用户可能打开过，不强制关闭，保留用户偏好
                }
            });

        })();
    </script>
</body>
</html>
